AWSTemplateFormatVersion: "2010-09-09"
Description: Lets GitHub Actions push images to ECR and update the Lambda function, with no stored AWS keys

Parameters:
  GitHubOwner:
    Type: String
    Default: ammartech-sol
  GitHubOwnerId:
    Type: String
    Description: Numeric id of the GitHub account that owns the repo
  GitHubRepo:
    Type: String
    Default: scifact-research-agent
  GitHubRepoId:
    Type: String
    Description: Numeric id of the repo

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/main"
                  # TEMPORARY: lets the ci-setup branch test the deploy. Delete this line after the merge.
                  - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/ci-setup"
      Policies:
        - PolicyName: push-image-and-update-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/scifact-research-agent"
              - Sid: LambdaUpdate
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:scifact-agent-AgentFunction-*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn