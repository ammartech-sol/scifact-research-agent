AWSTemplateFormatVersion: "2010-09-09"
Description: Private ECR repository for the scifact agent image, keeps only the last 2 images

Resources:
  AgentImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: scifact-research-agent
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "keep only the last 2 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 2
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt AgentImageRepository.RepositoryUri