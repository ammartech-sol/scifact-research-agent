name: ci

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install fastapi==0.162.2 pydantic==2.14.3 pytest==9.2.0 httpx==0.28.1

      - name: Run tests
        run: pytest