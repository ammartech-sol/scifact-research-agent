AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SciFact research agent on Lambda, a container image behind the Lambda Web Adapter

Parameters:
  ImageUri:
    Type: String
    Description: Full ECR image address with its tag, pushed before deploying

Resources:
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures:
        - x86_64
      MemorySize: 3008
      Timeout: 60
      Environment:
        Variables:
          AWS_LWA_ASYNC_INIT: "true"
      FunctionUrlConfig:
        AuthType: NONE

  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AgentFunction}
      RetentionInDays: 14

Outputs:
  AgentUrl:
    Value: !GetAtt AgentFunctionUrl.FunctionUrl